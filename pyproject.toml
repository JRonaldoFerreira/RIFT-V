[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riftv"
version = "0.2.0"
description = "RIFT-V: A Runtime-Aware Statistical Fault Injection Framework for TinyML Inference on RISC-V Microcontrollers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyserial>=3.5",
    "pyyaml>=6.0",
    "tflite>=2.10",
    "flatbuffers>=23.5",
]

[project.optional-dependencies]
tf = ["tensorflow>=2.13"]
dev = ["pytest", "ruff"]
firmware = ["platformio>=6.1"]
all = [
    "tensorflow>=2.13",
    "pytest",
    "ruff",
    "platformio>=6.1",
]

[project.scripts]
riftv = "riftv.cli:main"

[tool.setuptools.packages.find]
include = ["riftv*"]
