# ──────────────────────────────────────────────────
# Hybrid Campaign — Register + Memory FI
# ──────────────────────────────────────────────────

experiment:
  name: hybrid_lenet5_mnist
  description: "Both register and memory FI campaigns on LeNet-5 (MNIST, int8)"

model:
  tflite: "../models/lenet5_mnist_int8.tflite"
  subset_npz: "../models/mnist_subset.npz"

campaign:
  type: hybrid
  fault_duration: permanent   # "transient" = per-operator (MicroFI), "permanent" = whole inference
  register:
    target_ops: [CONV_2D, FULLY_CONNECTED]
    slot_count: 3
    registers: all
  memory:
    target_ops: [CONV_2D, DEPTHWISE_CONV_2D, FULLY_CONNECTED]

sampling:
  method: stratified
  confidence: 0.95
  margin: 0.05
  p_prior: 0.5
  seed: 42
  group_by: [op_index, op_name]

firmware:
  src_dir: "../firmware/src"

serial:
  port: COM3
  baud: 460800

output:
  dir: "../runs/{name}_{timestamp}"
