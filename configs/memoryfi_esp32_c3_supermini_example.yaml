# ──────────────────────────────────────────────────
# Memory Fault-Injection Campaign — ESP32-C3 Super Mini
# ──────────────────────────────────────────────────
# The ESP32-C3 Super Mini has the USB connector wired to the chip's
# built-in USB Serial/JTAG controller (native USB), NOT to a UART
# bridge.  This means:
#
#   serial.transport: usb_serial_jtag
#
# DTR/RTS reset over USB native does not trigger a real chip reset,
# so the framework skips it automatically and uses a proactive start
# handshake instead.
#
# If your C3 board has a CP2102/CH340 USB-to-UART bridge instead,
# change transport to "uart0".

experiment:
  name: memoryfi_image_classification_c3
  description: "Memory-FI bit-flip campaign on image_classification (Fashion MNIST, int8) — ESP32-C3 Super Mini"

model:
  tflite: "../models/image_classification_fashionmnist_int8.tflite"
  subset_npz: "../models/fashion_mnist_100_subset.npz"

campaign:
  type: memory
  fault_duration: transient
  memory:
    target_ops:
      - CONV_2D
      - FULLY_CONNECTED

sampling:
  method: stratified
  confidence: 0.95
  margin: 0.05
  p_prior: 0.5
  seed: 1337
  group_by: [op_index, op_name]

firmware:
  src_dir: "../firmware/src"
  platform: espressif32
  board: esp32-c3-devkitm-1
  framework: espidf
  monitor_speed: 460800
  idf_target: esp32c3

serial:
  port: COM17
  baud: 460800
  transport: usb_serial_jtag
  # run_port: COM17       # uncomment if capture port differs from flash port
  boot_timeout_s: 30
  max_hang_recoveries: 3       # forced resets when firmware hangs without rebooting
  hang_recovery_delay_s: 2.0   # seconds to wait between reset attempts
  # NOTE: DTR/RTS reset over USB native (usb_serial_jtag) may NOT trigger
  # a real chip reset. For reliable hang recovery on native-USB boards,
  # consider an external reset mechanism (e.g. relay on EN/RST pin).

output:
  dir: "../runs/{name}_{timestamp}"
  formats: [csv, jsonl]
