# ──────────────────────────────────────────────────
# Register Fault-Injection Campaign — Example Config
# ──────────────────────────────────────────────────

experiment:
  name: registerfi_image_classification_transient_all_registers
  description: "Register-FI bit-flip campaign on image_classification (MNIST, int8) — transient"

model:
  tflite: "../models/image_classification_fashionmnist_int8.tflite"
  subset_npz: "../models/fashion_mnist_100_subset.npz"

campaign:
  type: register
  fault_duration: transient    
  register:
    target_ops:
      - CONV_2D
      - DEPTHWISE_CONV_2D
      - FULLY_CONNECTED
    slot_count: 1
    registers: all              # "all" for x1–x31, or a list: [ra, sp, a0, t0, s0]
    bits: all                                 # "all" for bits 0–31, or a list: [0, 7, 15, 31]

sampling:
  method: stratified
  confidence: 0.95
  margin: 0.05
  p_prior: 0.5
  seed: 1337
  group_by: [op_index, op_name]

firmware:
  src_dir: "../firmware/src"
  platform: espressif32
  board: esp32-c6-devkitm-1
  framework: espidf
  monitor_speed: 460800
  idf_target: esp32c6
  # tensor_arena_size_kb: 48   # omit to auto-detect from available heap
  flash_size: 2MB

serial:
  port: COM18                  # COM do ESP32-C6 usb_serial_jtag
  baud: 460800
  boot_timeout_s: 30
  transport: uart0
  #supervisor_port: COM22       # COM do Raspberry Pi Pico
  max_hang_recoveries: 3
  hang_recovery_delay_s: 2.0      # uncomment if capture port differs from flash port
  

output:
  dir: "../runs/{name}_{timestamp}"
  formats: [csv, jsonl]
