# ──────────────────────────────────────────────────
# Register Fault-Injection Campaign — Example Config
# ──────────────────────────────────────────────────

experiment:
  name: registerfi_image_classification_fashion_mnist_transient_with_select_bit_select
  description: "Register-FI bit-flip campaign on Image_Classification (Fashion MNIST, int8) — transient"

model:
  tflite: "../models/image_classification_fashionmnist_int8.tflite"
  subset_npz: "../models/fashion_mnist_100_subset.npz"

campaign:
  type: register
  fault_duration: transient    
  register:
    target_ops:
      - CONV_2D
      - DEPTHWISE_CONV_2D
      - FULLY_CONNECTED
    slot_count: 1
    registers: ["a4"]              # "all" for x1–x31, or a list: [ra, sp, a0, t0, s0]
    bits: [22]                                 # "all" for bits 0–31, or a list: [0, 7, 15, 31]

sampling:
  method: stratified
  confidence: 0.95
  margin: 0.05
  p_prior: 0.5
  seed: 1337
  group_by: [op_index, op_name]

firmware:
  src_dir: "../firmware/src"
  platform: espressif32
  board: esp32-c3-devkitm-1
  framework: espidf
  monitor_speed: 460800
  idf_target: esp32c3
  # tensor_arena_size_kb: 48   # omit to auto-detect from available heap
  flash_size: 2MB

serial:
  port: COM20
  baud: 460800
  boot_timeout_s: 30
  transport: usb_serial_jtag
  max_hang_recoveries: 3       # forced resets when firmware hangs without rebooting
  hang_recovery_delay_s: 2.0
  # run_port: COM17       # uncomment if capture port differs from flash port
  

output:
  dir: "../runs/{name}_{timestamp}"
  formats: [csv, jsonl]
