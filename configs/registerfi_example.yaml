# ──────────────────────────────────────────────────
# Register Fault-Injection Campaign — Example Config
# ──────────────────────────────────────────────────

experiment:
  name: registerfi_lenet5_mnist
  description: "Register-FI bit-flip campaign on image_classification (Fashion MNIST, int8)"

model:
  tflite: "../models/image_classification_fashionmnist_int8.tflite"
  subset_npz: "../models/fashion_mnist_100_subset.npz"

campaign:
  type: register
  fault_duration: transient   
  register:
    target_ops:
      - CONV_2D
      - DEPTHWISE_CONV_2D
      - FULLY_CONNECTED
    slot_count: 3
    registers: all

sampling:
  method: stratified
  confidence: 0.95
  margin: 0.05
  p_prior: 0.5
  seed: 1337
  group_by: [op_index, op_name]

firmware:
  src_dir: "../firmware/src"
  platform: espressif32
  board: esp32-c3-devkitm-1
  framework: espidf
  monitor_speed: 460800
  idf_target: esp32c3

serial:
  port: COM17
  baud: 460800
  boot_timeout_s: 30
  transport: usb_serial_jtag
  # run_port: COM17       # uncomment if capture port differs from flash port
  

output:
  dir: "../runs/{name}_{timestamp}"
  formats: [csv, jsonl]
