# ──────────────────────────────────────────────────────────────────────
# LeNet-5 / MNIST — Register Fault-Injection Campaign
# ──────────────────────────────────────────────────────────────────────
# RECONSTRUÍDO automaticamente após exclusão acidental.  Os campos foram
# inferidos a partir de:
#   - run_manifest.json da campanha runs/lenet5_registerfi_mnist_20260512_125209_inferido
#   - trechos editados anteriormente (serial:, output:, firmware:, crash_verification_batch)
#   - configs/registerfi_example.yaml como template estrutural
# Revise os campos marcados com "# REVIEW" antes de rodar uma nova campanha.

experiment:
  name: lenet5_registerfi_mnist_crash_until_4
  description: "Register-FI bit-flip campaign on LeNet-5 (MNIST, int8) — transient"

model:
  tflite: "../models/lenet5_mnist_int8.tflite"
  subset_npz: "../models/mnist_100_subset_microfi_like.npz"

campaign:
  type: register
  fault_duration: transient
  register:
    target_ops:                         # REVIEW: ajuste se sua LeNet-5 tem só CONV_2D + FC
      - CONV_2D
      - FULLY_CONNECTED
    slot_count: 1
    registers: [
      "ra", "s0", "s1", "s2", "s3", 
      "s4", "s5", "s6", "s7", "s8", 
      "s9", "s10", "s11"]                      # "all" para x1–x31, ou lista [ra, sp, a0, t0, s0]
    bits: all                           # "all" para bits 0–31, ou lista [0, 7, 15, 31]

sampling:
  method: stratified
  confidence: 0.90
  margin: 0.05
  p_prior: 0.5
  seed: 1337
  group_by: [op_index, op_name]

firmware:
  src_dir: "../firmware/src"
  platform: espressif32
  board: esp32-c6-devkitm-1
  framework: espidf
  monitor_speed: 460800
  idf_target: esp32c6
  # tensor_arena_size_kb: 48            # omit to auto-detect from available heap
  flash_size: 2MB

serial:
  port: COM18                           # COM do ESP32-C6
  baud: 460800
  boot_timeout_s: 30
  transport: uart0
  # supervisor_port: COM22              # COM do Raspberry Pi Pico (se usar supervisor)
  max_hang_recoveries: 3
  hang_recovery_delay_s: 2.0
  # Crash-inference threshold — how many consecutive crashes on the same
  # fault are needed before the remaining images are synthesized as
  # ``inferred=True`` (skipping actual dispatch + crash recovery).
  #   0 (default) → never infer; dispatch every (fault, image) pair.
  #                 Most statistically faithful.  Recommended.
  #   1           → legacy "1 crash → infer all remaining" behaviour
  #                 (cheap but biased for intermittent faults).
  #   N ≥ 2       → require N consecutive crashes (any ok/SDC resets
  #                 the streak).  Middle ground.
  # See SerialConfig in riftv/config.py for the full bias / runtime
  # trade-off table.
  crash_inference_threshold: 4

output:
  dir: "../runs/{name}_{timestamp}"
  formats: [csv, jsonl]
