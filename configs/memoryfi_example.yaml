# ──────────────────────────────────────────────────
# Memory Fault-Injection Campaign — Example Config
# ──────────────────────────────────────────────────

experiment:
  name: memoryfi_image_classification
  description: "Memory-FI bit-flip campaign on image_classification (Fashion MNIST, int8)"

model:
  tflite: "../models/image_classification_fashionmnist_int8.tflite"
  subset_npz: "../models/fashion_mnist_100_subset.npz"

campaign:
  type: memory
  fault_duration: transient  
  memory:
    target_ops:
      - CONV_2D
      - FULLY_CONNECTED

sampling:
  method: stratified
  confidence: 0.95
  margin: 0.05
  p_prior: 0.5
  seed: 1337
  group_by: [op_index, op_name]

firmware:
  src_dir: "../firmware/src"
  platform: espressif32
  board: esp32-c6-devkitm-1
  framework: espidf
  monitor_speed: 460800
  # flash_size: 2MB   # uncomment if your module has 2MB instead of the board-default 4MB

serial:
  port: COM17
  baud: 460800
  boot_timeout_s: 30
  max_hang_recoveries: 3       # forced DTR/RTS resets when firmware hangs without rebooting
  hang_recovery_delay_s: 2.0   # seconds to wait between reset attempts

output:
  dir: "../runs/{name}_{timestamp}"
  formats: [csv, jsonl]
