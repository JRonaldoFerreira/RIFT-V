; PlatformIO Project Configuration File
;
; *** MANUAL FALLBACK ONLY ***
; The tflmfi framework generates its own platformio.ini under .tflmfi/
; and passes it to PlatformIO with -c.  This file is only useful if you
; want to run `pio run` manually without the Python framework.
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 460800
build_flags =
    -DTF_LITE_STATIC_MEMORY

[env:registerfi]
build_flags =
    ${env.build_flags}
    -DFI_CAMPAIGN_REGISTER=1

[env:memoryfi]
build_flags =
    ${env.build_flags}
    -DFI_CAMPAIGN_MEMORY=1